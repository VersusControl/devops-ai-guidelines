<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Light canvas -->
  <rect width="1600" height="760" fill="#f6f7fb"/>

  <!-- Decorative gradient blobs -->
  <circle cx="120" cy="80" r="220" fill="url(#grad)" opacity="0.12"/>
  <circle cx="1520" cy="720" r="260" fill="url(#grad)" opacity="0.14"/>

  <!-- Dotted grid texture -->
  <g fill="#c9cede">
    <circle cx="90" cy="560" r="4"/><circle cx="140" cy="560" r="4"/><circle cx="190" cy="560" r="4"/>
    <circle cx="90" cy="610" r="4"/><circle cx="140" cy="610" r="4"/><circle cx="190" cy="610" r="4"/>
    <circle cx="90" cy="660" r="4"/><circle cx="140" cy="660" r="4"/><circle cx="190" cy="660" r="4"/>
  </g>

  <!-- Left: copy -->
  <g>
    <rect x="120" y="150" width="220" height="44" rx="22" fill="#eef0fb" stroke="#d9def0" stroke-width="1"/>
    <circle cx="150" cy="172" r="7" fill="url(#grad)"/>
    <text x="170" y="179" font-size="20" fill="#4f46e5" font-weight="700" letter-spacing="1">LEARNING PATH</text>

    <text x="118" y="330" font-size="94" fill="#0f172a" font-weight="800">DevOps AI</text>
    <text x="118" y="440" font-size="94" font-weight="800" fill="url(#gradText)">Guidelines</text>

    <text x="120" y="520" font-size="30" fill="#475569" font-weight="500">From your first AI tool to</text>
    <text x="120" y="562" font-size="30" fill="#475569" font-weight="500">AI Infrastructure Architect</text>

    <!-- Topic pills -->
    <g font-size="19" font-weight="600">
      <rect x="120" y="606" width="86" height="40" rx="20" fill="#ffffff" stroke="#e2e6f2"/>
      <text x="163" y="632" fill="#6366f1" text-anchor="middle">MCP</text>
      <rect x="218" y="606" width="130" height="40" rx="20" fill="#ffffff" stroke="#e2e6f2"/>
      <text x="283" y="632" fill="#8b5cf6" text-anchor="middle">AI Agents</text>
      <rect x="360" y="606" width="150" height="40" rx="20" fill="#ffffff" stroke="#e2e6f2"/>
      <text x="435" y="632" fill="#db2777" text-anchor="middle">Monitoring</text>
      <rect x="522" y="606" width="80" height="40" rx="20" fill="#ffffff" stroke="#e2e6f2"/>
      <text x="562" y="632" fill="#ec4899" text-anchor="middle">SRE</text>
    </g>
  </g>

  <!-- Right: terminal window -->
  <g filter="url(#softShadow)">
    <rect x="960" y="190" width="520" height="380" rx="20" fill="#0f172a"/>
    <rect x="960" y="190" width="520" height="54" rx="20" fill="#1e293b"/>
    <rect x="960" y="224" width="520" height="20" fill="#1e293b"/>
    <circle cx="994" cy="217" r="8" fill="#f87171"/>
    <circle cx="1022" cy="217" r="8" fill="#fbbf24"/>
    <circle cx="1050" cy="217" r="8" fill="#34d399"/>
    <text x="1220" y="223" font-size="17" fill="#94a3b8" font-weight="600" text-anchor="middle" font-family="monospace">devops-ai ~ agent</text>

    <g font-family="monospace" font-size="21">
      <text x="990" y="300" fill="#a78bfa">$</text>
      <text x="1014" y="300" fill="#e2e8f0">ai deploy --stack k8s</text>
      <text x="990" y="342" fill="#64748b"># analyzing cluster...</text>
      <text x="990" y="384" fill="#34d399">✓ MCP server connected</text>
      <text x="990" y="426" fill="#34d399">✓ agent reasoning ready</text>
      <text x="990" y="468" fill="#38bdf8">→ escalating anomaly #204</text>
      <text x="990" y="510" fill="#a78bfa">$</text>
      <rect x="1014" y="493" width="14" height="24" fill="#e2e8f0">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Footer brand -->
  <text x="120" y="708" font-size="22" fill="#94a3b8" font-weight="600" letter-spacing="1">Sponsored by Versus Incident</text>
</svg>
