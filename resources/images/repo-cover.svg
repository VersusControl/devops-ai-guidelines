<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 -20 1600 800" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1f5c4d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Warm paper canvas -->
  <rect x="0" y="-20" width="1600" height="800" fill="#f2ede1"/>

  <!-- Dotted grid texture -->
  <g fill="#cdc4ae">
    <circle cx="90" cy="560" r="4"/><circle cx="140" cy="560" r="4"/><circle cx="190" cy="560" r="4"/>
    <circle cx="90" cy="610" r="4"/><circle cx="140" cy="610" r="4"/><circle cx="190" cy="610" r="4"/>
    <circle cx="90" cy="660" r="4"/><circle cx="140" cy="660" r="4"/><circle cx="190" cy="660" r="4"/>
  </g>

  <!-- Left: copy -->
  <g>
    <rect x="120" y="150" width="236" height="44" rx="22" fill="#ffffff" stroke="#d8ddd3" stroke-width="1"/>
    <circle cx="150" cy="172" r="7" fill="#1b2a25"/>
    <text x="172" y="178" font-size="18" fill="#1b2a25" font-weight="700" letter-spacing="0.5">LEARNING PATH</text>

    <text x="118" y="330" font-size="94" fill="#1b2a25" font-weight="800">DevOps AI</text>
    <text x="118" y="440" font-size="94" font-weight="800" fill="#1b2a25">Guidelines</text>

    <text x="120" y="520" font-size="30" fill="#1b2a25" font-weight="500">From your first AI tool to</text>
    <text x="120" y="562" font-size="30" fill="#1b2a25" font-weight="500">AI Infrastructure Architect</text>

    <!-- Topic pills -->
    <g font-size="19" font-weight="600">
      <rect x="120" y="606" width="130" height="40" rx="20" fill="#ffffff" stroke="#d8ddd3"/>
      <text x="185" y="632" fill="#1b2a25" text-anchor="middle">AI Agents</text>
      <rect x="262" y="606" width="90" height="40" rx="20" fill="#ffffff" stroke="#d8ddd3"/>
      <text x="307" y="632" fill="#1b2a25" text-anchor="middle">Cloud</text>
      <rect x="364" y="606" width="86" height="40" rx="20" fill="#ffffff" stroke="#d8ddd3"/>
      <text x="407" y="632" fill="#1b2a25" text-anchor="middle">MCP</text>
      <rect x="462" y="606" width="80" height="40" rx="20" fill="#ffffff" stroke="#d8ddd3"/>
      <text x="502" y="632" fill="#1b2a25" text-anchor="middle">SRE</text>
      <rect x="554" y="606" width="150" height="40" rx="20" fill="#ffffff" stroke="#d8ddd3"/>
      <text x="629" y="632" fill="#1b2a25" text-anchor="middle">Monitoring</text>
    </g>
  </g>

  <!-- Right: terminal window -->
  <g filter="url(#softShadow)">
    <rect x="960" y="190" width="520" height="380" rx="20" fill="#14211c"/>
    <rect x="960" y="190" width="520" height="54" rx="20" fill="#20342c"/>
    <rect x="960" y="224" width="520" height="20" fill="#20342c"/>
    <circle cx="994" cy="217" r="8" fill="#e06a4f"/>
    <circle cx="1022" cy="217" r="8" fill="#e0a343"/>
    <circle cx="1050" cy="217" r="8" fill="#4fbf8f"/>
    <text x="1220" y="223" font-size="17" fill="#8aa199" font-weight="600" text-anchor="middle" font-family="monospace">devops-ai ~ agent</text>

    <g font-family="monospace" font-size="21">
      <text x="990" y="300" fill="#e0a343">$</text>
      <text x="1014" y="300" fill="#e4ebe6">ai deploy --stack k8s</text>
      <text x="990" y="342" fill="#6f847b"># analyzing cluster...</text>
      <text x="990" y="384" fill="#4fbf8f">✓ MCP server connected</text>
      <text x="990" y="426" fill="#4fbf8f">✓ agent reasoning ready</text>
      <text x="990" y="468" fill="#e0a343">→ escalating anomaly #204</text>
      <text x="990" y="510" fill="#e0a343">$</text>
      <rect x="1014" y="493" width="14" height="24" fill="#e4ebe6">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Footer brand -->
  <text x="120" y="708" font-size="22" fill="#1b2a25" font-weight="600" letter-spacing="1">Sponsored by Versus Incident</text>
</svg>
